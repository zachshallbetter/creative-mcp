[package]
name = "creative-mcp"
version = "0.2.3"
edition = "2021"
description = "Detects your creative apps and MCP clients, then installs and registers the matching Creative MCP servers"
authors = ["Zach Shallbetter"]
license = "MIT"
repository = "https://github.com/zachshallbetter/creative-mcp"
homepage = "https://creativemcp.com"
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "adobe", "blender", "installer"]
categories = ["command-line-utilities"]

[[bin]]
name = "creative-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[profile.release]
strip = true
lto = true
