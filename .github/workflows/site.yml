name: Site
# Site listings must match the catalogue (generate-catalogue.py), and every sitemap page, its social card,
# JSON-LD and discovery entries must agree (check-site.py).
on:
  pull_request:
    paths: ["site/**", "registry/**"]
  push:
    branches: [main]
    paths: ["site/**", "registry/**"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Listings match the catalogue
        run: |
          python3 site/scripts/generate-catalogue.py
          git diff --exit-code -- site/dist || { echo "::error::Run site/scripts/generate-catalogue.py and commit the result"; exit 1; }
      - run: python3 site/scripts/check-site.py
