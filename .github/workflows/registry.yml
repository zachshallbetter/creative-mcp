name: Validate registry
on:
  workflow_dispatch:
  pull_request:
    paths: ["registry/**"]
  push:
    branches: [main]
    paths: ["registry/**"]
concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.18"
      - run: python registry/validate.py
